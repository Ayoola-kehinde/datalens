<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — DataLens</title>
<style>
  :root{
    --bg:#080a0e; --surface:#141821; --surface-raised:#1b202b; --border:#262d3a;
    --text-primary:#e8eaf0; --text-secondary:#9aa1b1; --text-muted:#6b7585;
    --accent:#2962ff; --on-accent:#fff; --secondary-500:#e8a90d;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);
    min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:32px;max-width:440px;width:100%;text-align:center;
  }
  .mark{
    width:52px;height:52px;margin:0 auto 20px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(145deg,#5b90ff,#1e4fd6 55%,#e8a90d);color:#fff;
    font-size:15px;font-weight:800;letter-spacing:-.02em;
  }
  h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  p{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
  button{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:10px 20px;border-radius:6px;border:1px solid transparent;
    background:var(--accent);color:var(--on-accent);
    transition:background .18s ease;
  }
  button:hover{background:#5b90ff}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .note{font-size:11px;color:var(--text-muted);margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--secondary-500);margin-right:6px}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">DL</div>
    <h1>You're offline</h1>
    <p>
      DataLens couldn't reach the network. Previously loaded company data is still
      available offline, but new uploads and conversations need a connection.
    </p>
    <button onclick="location.reload()">Try again</button>
    <div class="note">
      <span class="dot"></span>DataLens prototype · sample data only · not investment advice
    </div>
  </main>
</body>
</html>
